[project]
name = "contrib-pilot"
version = "0.1.0"
description = "Contribution Copilot: a bounded, human-approved first-contribution workflow for convention-heavy repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
assistant = [
    "anthropic>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # Real dependencies of the pinned vLLM source file bundled in the demo
    # fixture (demo/fixture/vllm/utils/import_utils.py) — needed only to
    # run the fixture's own tests, not by contrib-pilot itself.
    "regex>=2024.5",
    "typing-extensions>=4.12",
    # Planned tests for FastAPI handlers import starlette/fastapi without a
    # full target-project install.
    "fastapi>=0.115",
    # Same SDK as extra `assistant`. Listed here so `uv sync` keeps it
    # installed; OneDrive locks `.venv` metadata dirs and uv cannot uninstall.
    "anthropic>=0.34",
]

[project.scripts]
contrib-pilot = "contrib_pilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contrib_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
